</html>  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobs-Mod</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #1b0b12 0%, #09090d 75%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .avatar {
      width: 96px;
      height: 96px;
      background: #0d0d12;
      border: 3px solid #ff2a4b;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(255, 42, 75, 0.45);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .eyes {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }
    .eye {
      width: 18px;
      height: 10px;
      background: #39ff14;
      box-shadow: 0 0 12px #39ff14;
      border-radius: 2px;
    }
    .red-stripe {
      width: 100%;
      height: 10px;
      background: #ff2a4b;
      box-shadow: 0 0 10px #ff2a4b;
      margin-top: 18px;
    }
    h1 {
      font-size: 2.2rem;
      margin: 0 0 6px 0;
      letter-spacing: 1px;
      text-shadow: 0 0 14px rgba(255, 42, 75, 0.6);
    }
    .subtitle {
      color: #9ca3af;
      font-size: 0.95rem;
      margin-bottom: 22px;
    }
    form {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 460px;
      margin-bottom: 22px;
    }
    input {
      flex: 1;
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid #2e2e3a;
      background: #14141c;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #39ff14;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.25);
    }
    button {
      padding: 13px 20px;
      border-radius: 12px;
      border: none;
      background: #ff2a4b;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    button:hover {
      background: #e01e3c;
      transform: scale(1.03);
    }
    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }
    .card {
      background: #14141c;
      border: 1px solid #262633;
      padding: 12px 18px;
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: border-color 0.2s, transform 0.15s;
    }
    .card:hover {
      border-color: #39ff14;
      transform: translateY(-2px);
    }
    .cloak-btn {
      margin-top: 24px;
      background: #1e1e28;
      border: 1px solid #323242;
      font-size: 0.85rem;
      padding: 9px 14px;
    }
  </style>
</head>
<body>
  <div class="avatar">
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
    <div class="red-stripe"></div>
  </div>

  <h1>Mobs-Mod</h1>
  <div class="subtitle">Custom Web Hub</div>

  <form action="https://duckduckgo.com" method="GET">
    <input type="text" name="q" placeholder="Search the web..." required>
    <button type="submit">Search</button>
  </form>

  <div class="links">
    <a class="card" href="https://duckduckgo.com">DuckDuckGo</a>
    <a class="card" href="https://wikipedia.org">Wikipedia</a>
    <a class="card" href="https://youtube.com">ThatMob YT</a>
  </div>

  <button class="cloak-btn" onclick="cloakTab()">Disguise Tab as Google Drive</button>

  <script>
    function cloakTab() {
      document.title = "My Drive - Google Drive";
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = "https://gstatic.com";
    }
  </script>
</body>
</html>
